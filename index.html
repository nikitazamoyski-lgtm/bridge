<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Rappi Stake</title>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=DM+Mono:wght@500&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        :root {
            --primary: #FF5A1F;
            --primary-dark: #E54D18;
            --success: #10b981;
            --bg: #fafbfc;
            --surface: #ffffff;
            --border: #e5e7eb;
            --text: #111827;
            --text-secondary: #6b7280;
            --text-muted: #9ca3af;
            --shadow: 0 1px 3px rgba(0,0,0,0.05);
        }

        body {
            font-family: 'Manrope', -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.5;
            overflow-x: hidden;
        }

        /* Header */
        .header {
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            padding: 12px 16px;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1200px;
            margin: 0 auto;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo-icon {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, #FF5A1F 0%, #ff8c42 100%);
            border-radius: 11px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 16px rgba(255, 90, 31, 0.25);
            font-size: 22px;
            font-weight: 900;
            color: white;
            position: relative;
            overflow: hidden;
        }

        .logo-icon::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(45deg, transparent, rgba(255,255,255,0.1), transparent);
            animation: shimmer 3s infinite;
        }

        @keyframes shimmer {
            0% { transform: translateX(-100%) translateY(-100%) rotate(30deg); }
            100% { transform: translateX(100%) translateY(100%) rotate(30deg); }
        }

        .logo-text {
            font-size: 22px;
            font-weight: 800;
            letter-spacing: 0.5px;
            background: linear-gradient(135deg, #FF5A1F, #ff8c42);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .wallet-badge {
            font-family: 'DM Mono', monospace;
            font-size: 12px;
            padding: 6px 12px;
            background: var(--bg);
            border-radius: 8px;
            color: var(--text-secondary);
            font-weight: 500;
        }

        .wallet-dot {
            display: inline-block;
            width: 6px;
            height: 6px;
            background: var(--success);
            border-radius: 50%;
            margin-right: 6px;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        /* Container */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 16px;
        }

        /* Stats - КОМПАКТНЫЕ */
        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-bottom: 16px;
        }

        .stat {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 10px 8px;
            text-align: center;
        }

        .stat-label {
            font-size: 9px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.3px;
            color: var(--text-muted);
            margin-bottom: 4px;
        }

        .stat-value {
            font-size: 15px;
            font-weight: 800;
            margin-bottom: 2px;
        }

        .stat-value.primary { color: var(--primary); }
        .stat-value.success { color: var(--success); }

        .stat-sub {
            font-size: 8px;
            color: var(--text-muted);
        }

        /* Section */
        .section {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 16px;
        }

        .section-title {
            font-size: 15px;
            font-weight: 700;
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* Token List */
        .token-list {
            max-height: 280px;
            overflow-y: auto;
            margin: 0 -16px;
            padding: 0 16px;
        }

        .token-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            border: 2px solid transparent;
        }

        .token-item:hover {
            background: var(--bg);
        }

        .token-item.selected {
            background: var(--bg);
            border-color: var(--primary);
        }

        .token-icon {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            flex-shrink: 0;
        }

        .token-info {
            flex: 1;
            min-width: 0;
        }

        .token-row {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
        }

        .token-symbol {
            font-weight: 700;
            font-size: 14px;
        }

        .token-price {
            font-size: 12px;
            color: var(--text-secondary);
            font-weight: 600;
        }

        .token-name {
            font-size: 11px;
            color: var(--text-muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .token-balance-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 2px;
        }

        .token-balance {
            font-size: 10px;
            color: var(--text-muted);
        }

        .token-balance.has-balance {
            color: var(--success);
            font-weight: 600;
        }

        .token-balance-usd {
            font-size: 10px;
            color: var(--text-muted);
            font-weight: 600;
        }

        .token-network {
            font-size: 10px;
            color: var(--text-muted);
            background: var(--surface);
            padding: 2px 6px;
            border-radius: 4px;
            display: inline-block;
            margin-left: 4px;
        }

        /* Network Selection */
        .network-selector {
            display: none;
            margin-top: 10px;
            padding: 10px;
            background: var(--bg);
            border-radius: 8px;
        }

        .network-selector.active {
            display: block;
        }

        .network-label {
            font-size: 11px;
            font-weight: 700;
            color: var(--text-secondary);
            margin-bottom: 8px;
        }

        .network-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 6px;
        }

        .network-btn {
            background: var(--surface);
            border: 2px solid var(--border);
            border-radius: 6px;
            padding: 8px;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
            font-size: 12px;
            font-weight: 600;
        }

        .network-btn:hover {
            border-color: var(--primary);
        }

        .network-btn.active {
            background: var(--primary);
            border-color: var(--primary);
            color: white;
        }

        /* Form */
        .form-group {
            margin-bottom: 14px;
        }

        .form-label {
            font-size: 12px;
            font-weight: 700;
            margin-bottom: 6px;
            display: block;
            color: var(--text-secondary);
        }

        /* Token Filters */
        .token-filters {
            display: flex;
            gap: 6px;
            margin-bottom: 10px;
            overflow-x: auto;
            padding-bottom: 4px;
        }

        .filter-btn {
            background: var(--bg);
            border: 2px solid var(--border);
            border-radius: 8px;
            padding: 6px 12px;
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s;
            color: var(--text-secondary);
        }

        .filter-btn:hover {
            border-color: var(--primary);
        }

        .filter-btn.active {
            background: var(--primary);
            border-color: var(--primary);
            color: white;
        }

        .filter-count {
            display: inline-block;
            background: rgba(255,255,255,0.2);
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 10px;
            margin-left: 4px;
        }

        .filter-btn:not(.active) .filter-count {
            background: var(--border);
            color: var(--text-muted);
        }

        .input {
            width: 100%;
            padding: 12px;
            padding-right: 60px;
            border: 2px solid var(--border);
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            font-family: 'Manrope', sans-serif;
        }

        .input:focus {
            outline: none;
            border-color: var(--primary);
        }

        .input-hint {
            font-size: 11px;
            color: var(--text-muted);
            margin-top: 4px;
        }

        .input-wrapper {
            position: relative;
        }

        .max-btn {
            position: absolute;
            right: 8px;
            top: 8px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 6px;
            padding: 8px 14px;
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            font-family: 'Manrope', sans-serif;
        }

        .max-btn:active {
            transform: scale(0.95);
        }

        /* Period Grid */
        .period-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
        }

        .period-btn {
            background: var(--bg);
            border: 2px solid var(--border);
            border-radius: 8px;
            padding: 10px 8px;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
        }

        .period-btn.active {
            background: var(--primary);
            border-color: var(--primary);
            color: white;
        }

        .period-name {
            font-size: 11px;
            font-weight: 700;
            margin-bottom: 2px;
        }

        .period-apy {
            font-size: 14px;
            font-weight: 800;
            color: var(--success);
        }

        .period-btn.active .period-apy {
            color: white;
        }

        /* Estimate - КОМПАКТНЫЙ И ЦЕНТРИРОВАННЫЙ */
        .estimate {
            background: linear-gradient(135deg, #FF5A1F, #ff8c42);
            border-radius: 10px;
            padding: 12px;
            text-align: center;
            color: white;
            max-width: 280px;
            margin: 0 auto;
        }

        .estimate-label {
            font-size: 11px;
            opacity: 0.85;
            margin-bottom: 4px;
        }

        .estimate-value {
            font-size: 20px;
            font-weight: 800;
        }

        .estimate-usd {
            font-size: 12px;
            opacity: 0.85;
            margin-top: 2px;
        }

        /* Button */
        .btn {
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 10px;
            padding: 14px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            width: 100%;
            font-family: 'Manrope', sans-serif;
            transition: all 0.2s;
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn-secondary {
            background: var(--bg);
            color: var(--text);
            border: 2px solid var(--border);
        }

        .btn-success {
            background: var(--success);
        }

        /* Stakes */
        .stake-item {
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 12px;
            margin-bottom: 10px;
        }

        .stake-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .stake-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .stake-icon {
            width: 32px;
            height: 32px;
            border-radius: 50%;
        }

        .stake-symbol {
            font-weight: 700;
            font-size: 14px;
        }

        .stake-period {
            font-size: 11px;
            color: var(--text-muted);
        }

        .stake-badge {
            font-size: 10px;
            font-weight: 700;
            padding: 4px 8px;
            border-radius: 6px;
        }

        .stake-badge.active {
            background: #dcfce7;
            color: #166534;
        }

        .stake-badge.completed {
            background: #dbeafe;
            color: #1e40af;
        }

        .stake-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-bottom: 10px;
        }

        .stake-cell {
            font-size: 11px;
        }

        .stake-cell-label {
            color: var(--text-muted);
            margin-bottom: 2px;
        }

        .stake-cell-value {
            font-weight: 700;
            font-size: 13px;
        }

        .stake-cell-usd {
            font-size: 10px;
            color: var(--text-muted);
        }

        /* Loading Modal */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            backdrop-filter: blur(4px);
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: var(--surface);
            border-radius: 16px;
            padding: 32px;
            max-width: 320px;
            text-align: center;
            animation: modalPop 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes modalPop {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .modal-icon {
            width: 64px;
            height: 64px;
            margin: 0 auto 16px;
            background: linear-gradient(135deg, #FF5A1F, #ff8c42);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
        }

        .loading-spinner {
            width: 48px;
            height: 48px;
            border: 4px solid rgba(255,90,31,0.2);
            border-top-color: #FF5A1F;
            border-radius: 50%;
            margin: 0 auto 16px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .modal-title {
            font-size: 20px;
            font-weight: 800;
            margin-bottom: 8px;
        }

        .modal-text {
            font-size: 14px;
            color: var(--text-secondary);
            margin-bottom: 4px;
        }

        .modal-sub {
            font-size: 12px;
            color: var(--text-muted);
        }

        /* Mobile Responsive */
        @media (max-width: 600px) {
            .period-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>
<body>
    <!-- Header -->
    <div class="header">
        <div class="header-content">
            <div class="logo">
                <div class="logo-icon">R</div>
                <div class="logo-text">RAPPI STAKE</div>
            </div>
            <div class="wallet-badge">
                <span class="wallet-dot"></span>
                <span id="walletAddr">0x5213...3dcf</span>
            </div>
        </div>
    </div>

    <!-- Main -->
    <div class="container">
        <!-- Stats -->
        <div class="stats">
            <div class="stat">
                <div class="stat-label">Total</div>
                <div class="stat-value primary" id="totalStaked">$0</div>
            </div>
            <div class="stat">
                <div class="stat-label">Earned</div>
                <div class="stat-value success" id="totalEarned">$0</div>
            </div>
            <div class="stat">
                <div class="stat-label">Active</div>
                <div class="stat-value" id="activeCount">0</div>
                <div class="stat-sub" id="completedCount">0 done</div>
            </div>
        </div>

        <!-- Stake Section -->
        <div class="section">
            <div class="section-title">💰 Stake Tokens</div>

            <!-- Select Token -->
            <div class="form-group">
                <div class="form-label">Select Token</div>
                
                <!-- Фильтры -->
                <div class="token-filters" id="tokenFilters"></div>
                
                <div class="token-list" id="tokenList"></div>
                
                <!-- Network Selector (показывается только для стейблкоинов) -->
                <div class="network-selector" id="networkSelector">
                    <div class="network-label">Select Network</div>
                    <div class="network-grid" id="networkGrid"></div>
                </div>
            </div>

            <!-- Amount -->
            <div class="form-group">
                <div class="form-label">Amount</div>
                <div class="input-wrapper">
                    <input type="number" class="input" id="amount" placeholder="0.0" step="0.0001">
                    <button class="max-btn" onclick="setMaxAmount()">MAX</button>
                </div>
                <div class="input-hint">Balance: <span id="balance">0</span> <span id="symbol">ETH</span> • Max $5,000</div>
            </div>

            <!-- Period -->
            <div class="form-group">
                <div class="form-label">Period</div>
                <div class="period-grid" id="periodGrid"></div>
            </div>

            <!-- Estimate -->
            <div class="form-group">
                <div class="estimate">
                    <div class="estimate-label">You will receive</div>
                    <div class="estimate-value" id="estValue">0.0000 ETH</div>
                    <div class="estimate-usd" id="estUsd">≈ $0.00</div>
                </div>
            </div>

            <!-- Stake Button -->
            <button class="btn" onclick="stake()">Stake Now</button>
        </div>

        <!-- Your Stakes -->
        <div class="section">
            <div class="section-title">📊 Your Stakes</div>
            <div id="stakesList"></div>
        </div>
    </div>

    <!-- Loading Modal -->
    <div class="modal" id="loadingModal">
        <div class="modal-content">
            <div class="loading-spinner"></div>
            <div class="modal-title">Processing Withdrawal</div>
            <div class="modal-text">Sending to Trust Wallet</div>
            <div class="modal-sub" id="countdown">8 seconds remaining...</div>
        </div>
    </div>

    <!-- Success Modal -->
    <div class="modal" id="successModal">
        <div class="modal-content">
            <div class="modal-icon">✓</div>
            <div class="modal-title">Withdrawal Complete!</div>
            <div class="modal-text" id="successText"></div>
        </div>
    </div>

    <script>
        const MAX_DEPOSIT = 5000;
        
        const PRICES = {

            // DeFi Blue chips
            { symbol: 'LINK', name: 'Chainlink', logo: 'https://assets.coingecko.com/coins/images/877/small/chainlink-new-logo.png', balance: 12.34, networks: null },
            { symbol: 'UNI', name: 'Uniswap', logo: 'https://assets.coingecko.com/coins/images/12504/small/uni.jpg', balance: 45.27, networks: null },
            { symbol: 'AAVE', name: 'Aave', logo: 'https://assets.coingecko.com/coins/images/12645/small/aave-token-round.png', balance: 0, networks: null },
            { symbol: 'CRV', name: 'Curve DAO', logo: 'https://assets.coingecko.com/coins/images/12124/small/Curve.png', balance: 0, networks: null },
            { symbol: 'SUSHI', name: 'SushiSwap', logo: 'https://assets.coingecko.com/coins/images/12271/small/512x512_Logo_no_chop.png', balance: 0, networks: null },
            { symbol: 'COMP', name: 'Compound', logo: 'https://assets.coingecko.com/coins/images/10775/small/COMP.png', balance: 0, networks: null },
            { symbol: 'MKR', name: 'Maker', logo: 'https://assets.coingecko.com/coins/images/1364/small/Mark_Maker.png', balance: 0, networks: null },
            { symbol: 'SNX', name: 'Synthetix', logo: 'https://assets.coingecko.com/coins/images/3406/small/SNX.png', balance: 0, networks: null },
            
            // Layer 2 / Alt chains
            { symbol: 'MATIC', name: 'Polygon', logo: 'https://assets.coingecko.com/coins/images/4713/small/matic-token-icon.png', balance: 543.48, networks: null },
            { symbol: 'AVAX', name: 'Avalanche', logo: 'https://assets.coingecko.com/coins/images/12559/small/Avalanche_Circle_RedWhite_Trans.png', balance: 0, networks: null },
            { symbol: 'FTM', name: 'Fantom', logo: 'https://assets.coingecko.com/coins/images/4001/small/Fantom_round.png', balance: 0, networks: null },
            { symbol: 'OP', name: 'Optimism', logo: 'https://assets.coingecko.com/coins/images/25244/small/Optimism.png', balance: 93.02, networks: null },
            { symbol: 'ARB', name: 'Arbitrum', logo: 'https://assets.coingecko.com/coins/images/16547/small/photo_2023-03-29_21.47.00.jpeg', balance: 0, networks: null },
            
            // Staking & Liquid Staking
            { symbol: 'LDO', name: 'Lido DAO', logo: 'https://assets.coingecko.com/coins/images/13573/small/Lido_DAO.png', balance: 0, networks: null },
            { symbol: 'IMX', name: 'Immutable X', logo: 'https://assets.coingecko.com/coins/images/17233/small/immutableX-symbol-BLK-RGB.png', balance: 0, networks: null },
            { symbol: 'PENDLE', name: 'Pendle', logo: 'https://assets.coingecko.com/coins/images/15069/small/Pendle_Logo_Normal-03.png', balance: 0, networks: null },
            
            // Meme coins
            { symbol: 'PEPE', name: 'Pepe', logo: 'https://assets.coingecko.com/coins/images/29850/small/pepe-token.jpeg', balance: 0, networks: null },
            { symbol: 'SHIB', name: 'Shiba Inu', logo: 'https://assets.coingecko.com/coins/images/11939/small/shiba.png', balance: 0, networks: null },
            { symbol: 'DOGE', name: 'Dogecoin', logo: 'https://assets.coingecko.com/coins/images/5/small/dogecoin.png', balance: 0, networks: null },
            { symbol: 'FLOKI', name: 'Floki', logo: 'https://assets.coingecko.com/coins/images/16746/small/PNG_image.png', balance: 0, networks: null },
            
            // Gaming / Metaverse
            { symbol: 'SAND', name: 'The Sandbox', logo: 'https://assets.coingecko.com/coins/images/12129/small/sandbox_logo.jpg', balance: 0, networks: null },
            { symbol: 'MANA', name: 'Decentraland', logo: 'https://assets.coingecko.com/coins/images/878/small/decentraland-mana.png', balance: 0, networks: null },
            { symbol: 'AXS', name: 'Axie Infinity', logo: 'https://assets.coingecko.com/coins/images/13029/small/axie_infinity_logo.png', balance: 0, networks: null },
            { symbol: 'GALA', name: 'Gala', logo: 'https://assets.coingecko.com/coins/images/12493/small/GALA-COINGECKO.png', balance: 0, networks: null },
            { symbol: 'ENJ', name: 'Enjin Coin', logo: 'https://assets.coingecko.com/coins/images/1102/small/enjin-coin-logo.png', balance: 0, networks: null },
            { symbol: 'APE', name: 'ApeCoin', logo: 'https://assets.coingecko.com/coins/images/24383/small/apecoin.jpg', balance: 0, networks: null },
            
            // Infrastructure
            { symbol: 'GRT', name: 'The Graph', logo: 'https://assets.coingecko.com/coins/images/13397/small/Graph_Token.png', balance: 0, networks: null },
            { symbol: '1INCH', name: '1inch', logo: 'https://assets.coingecko.com/coins/images/13469/small/1inch-token.png', balance: 0, networks: null },
            { symbol: 'BAL', name: 'Balancer', logo: 'https://assets.coingecko.com/coins/images/11683/small/Balancer.png', balance: 0, networks: null },
            { symbol: 'YFI', name: 'yearn.finance', logo: 'https://assets.coingecko.com/coins/images/11849/small/yearn.jpg', balance: 0, networks: null },
            { symbol: 'RUNE', name: 'THORChain', logo: 'https://assets.coingecko.com/coins/images/6595/small/thor.png', balance: 0, networks: null },
            { symbol: 'ATOM', name: 'Cosmos', logo: 'https://assets.coingecko.com/coins/images/1481/small/cosmos_hub.png', balance: 0, networks: null }
        ];

        const APY = {
            1: 0.42, 3: 1.26, 7: 2.94, 14: 5.88, 30: 13.0
        };

        const PERIODS = { 1: 'Daily', 3: '3 Days', 7: 'Weekly', 14: '2 Weeks', 30: 'Monthly' };

        let stakes = [
            { 
                symbol: 'ETH', 
                network: null, 
                amount: 0.8696, // ~$3000
                period: 3, 
                apy: 1.26, 
                rewards: 0.01096, // ~$37.80
                start: Date.now() - 3*86400000, // 3 дня назад
                done: true 
            },
            { 
                symbol: 'USDT', 
                network: 'Ethereum', 
                amount: 850.50, 
                period: 30, 
                apy: 15.5, 
                rewards: 131.83, // 850.50 * 15.5%
                start: Date.now() - 8*86400000, // 8 дней назад
                done: false 
            }
        ];

        let selected = TOKENS[0];
        let selectedNetwork = null;
        let period = 30;
        let currentFilter = 'all';

        function fmt(n) {
            if(n >= 1e6) return (n/1e6).toFixed(2)+'M';
            if(n >= 1e3) return (n/1e3).toFixed(2)+'K';
            if(n < 0.0001) return n.toFixed(8);
            if(n < 1) return n.toFixed(6);
            return n.toFixed(4);
        }

        function loadFilters() {
            const filters = document.getElementById('tokenFilters');
            
            // Подсчёт токенов для каждой категории
            const withBalance = TOKENS.filter(t => t.balance > 0).length;
            const inStaking = stakes.filter(s => !s.done).length;
            const allTokens = TOKENS.length;
            
            const filterButtons = [
                { id: 'all', label: 'All Tokens', count: allTokens },
                { id: 'available', label: 'Available', count: withBalance },
                { id: 'staking', label: 'In Staking', count: inStaking }
            ];
            
            filters.innerHTML = '';
            filterButtons.forEach(f => {
                const btn = document.createElement('div');
                btn.className = 'filter-btn' + (f.id === currentFilter ? ' active' : '');
                btn.onclick = () => {
                    currentFilter = f.id;
                    loadFilters();
                    loadTokens();
                };
                btn.innerHTML = `${f.label}<span class="filter-count">${f.count}</span>`;
                filters.appendChild(btn);
            });
        }

        function getFilteredTokens() {
            switch(currentFilter) {
                case 'available':
                    // Токены с балансом
                    return TOKENS.filter(t => t.balance > 0);
                case 'staking':
                    // Токены в стейкинге (активные)
                    const stakingSymbols = stakes.filter(s => !s.done).map(s => s.symbol);
                    return TOKENS.filter(t => stakingSymbols.includes(t.symbol));
                case 'all':
                default:
                    return TOKENS;
            }
        }

        function loadTokens() {
            const list = document.getElementById('tokenList');
            list.innerHTML = '';
            
            const filteredTokens = getFilteredTokens();
            
            if (filteredTokens.length === 0) {
                list.innerHTML = '<div style="text-align:center;padding:20px;color:var(--text-muted);font-size:12px;">No tokens in this category</div>';
                return;
            }
            
            filteredTokens.forEach(t => {
                const balanceUSD = t.balance * PRICES[t.symbol];
                const hasBalance = t.balance > 0;
                const inStaking = stakes.some(s => s.symbol === t.symbol && !s.done);
                
                const div = document.createElement('div');
                div.className = 'token-item' + (t.symbol === selected.symbol ? ' selected' : '');
                div.onclick = () => { 
                    selected = t; 
                    selectedNetwork = null;
                    loadTokens(); 
                    loadNetworks();
                    loadPeriods(); 
                    updateEst(); 
                };
                
                // Статус токена
                let statusBadge = '';
                if (inStaking) {
                    statusBadge = '<span style="font-size:10px;color:var(--primary);margin-left:4px;">• Staking</span>';
                }
                
                div.innerHTML = `
                    <img src="${t.logo}" class="token-icon" onerror="this.style.display='none'">
                    <div class="token-info">
                        <div class="token-row">
                            <div class="token-symbol">${t.symbol}${t.networks ? ' 🌐' : ''}${statusBadge}</div>
                            <div class="token-price">$${PRICES[t.symbol] >= 1 ? PRICES[t.symbol].toFixed(2) : PRICES[t.symbol]}</div>
                        </div>
                        <div class="token-name">${t.name} • ${t.network}</div>
                        <div class="token-balance-row">
                            <div class="token-balance ${hasBalance ? 'has-balance' : ''}">
                                ${hasBalance ? fmt(t.balance) + ' ' + t.symbol : '0 balance'}
                            </div>
                            ${hasBalance ? `<div class="token-balance-usd">≈ $${fmt(balanceUSD)}</div>` : ''}
                        </div>
                    </div>
                `;
                list.appendChild(div);
            });
            document.getElementById('symbol').textContent = selected.symbol;
            document.getElementById('balance').textContent = fmt(selected.balance);
        }

        function loadNetworks() {
            const selector = document.getElementById('networkSelector');
            const grid = document.getElementById('networkGrid');
            
            // Если токен без вариантов сетей - скрыть селектор
            if (!selected.networks) {
                selector.classList.remove('active');
                return;
            }

            // Если есть баланс - токены уже в конкретной сети, выбор недоступен
            if (selected.balance > 0) {
                selector.classList.remove('active');
                selectedNetwork = selected.network; // Используем статичную сеть
                return;
            }

            // Если баланса нет - можно выбрать любую сеть для стейкинга
            selector.classList.add('active');
            grid.innerHTML = '';
            
            selected.networks.forEach(network => {
                const btn = document.createElement('div');
                btn.className = 'network-btn' + (network === selectedNetwork ? ' active' : '');
                btn.onclick = () => {
                    selectedNetwork = network;
                    loadNetworks();
                    updateEst();
                };
                btn.textContent = network;
                grid.appendChild(btn);
            });

            // Автоматически выбрать первую сеть если ничего не выбрано
            if (!selectedNetwork && selected.networks.length > 0) {
                selectedNetwork = selected.networks[0];
                loadNetworks();
            }
        }

        function loadPeriods() {
            const grid = document.getElementById('periodGrid');
            grid.innerHTML = '';
            Object.keys(APY).forEach(d => {
                const btn = document.createElement('div');
                btn.className = 'period-btn' + (d == period ? ' active' : '');
                btn.onclick = () => { period = d; loadPeriods(); updateEst(); };
                btn.innerHTML = `
                    <div class="period-name">${PERIODS[d]}</div>
                    <div class="period-apy">${APY[d]}%</div>
                `;
                grid.appendChild(btn);
            });
        }

        function updateEst() {
            const amt = parseFloat(document.getElementById('amount').value) || 0;
            const rew = amt * (APY[period] / 100);
            const usd = rew * PRICES[selected.symbol];
            document.getElementById('estValue').textContent = fmt(rew) + ' ' + selected.symbol;
            document.getElementById('estUsd').textContent = '≈ $' + fmt(usd);
        }

        function setMaxAmount() {
            // Вычисляем максимальную сумму с учетом лимита $5000
            const maxUSD = MAX_DEPOSIT;
            const tokenPrice = PRICES[selected.symbol];
            const maxByUSD = maxUSD / tokenPrice;
            
            // Берём минимум из баланса и лимита $5000
            const maxAmount = Math.min(selected.balance, maxByUSD);
            
            // Устанавливаем значение
            document.getElementById('amount').value = maxAmount > 0 ? maxAmount.toFixed(8) : '0';
            
            // Обновляем оценку
            updateEst();
        }

        function stake() {
            const amt = parseFloat(document.getElementById('amount').value);
            if(!amt || amt <= 0) return alert('Enter amount!');
            if(amt * PRICES[selected.symbol] > MAX_DEPOSIT) return alert(`Max deposit: $${MAX_DEPOSIT}`);
            if(amt > selected.balance) return alert('Insufficient balance!');

            // Проверка выбора сети для стейблкоинов
            if(selected.networks && !selectedNetwork) {
                return alert('Please select a network!');
            }

            const rew = amt * (APY[period] / 100);
            stakes.push({ 
                symbol: selected.symbol, 
                network: selectedNetwork,
                amount: amt, 
                period, 
                apy: APY[period], 
                rewards: rew, 
                start: Date.now(), 
                done: false 
            });
            selected.balance -= amt;

            document.getElementById('amount').value = '';
            loadTokens();
            updateStats();
            renderStakes();
            updateEst();
            
            const networkText = selectedNetwork ? ` on ${selectedNetwork}` : '';
            alert(`✅ Staked ${fmt(amt)} ${selected.symbol}${networkText}!\nRewards: +${fmt(rew)} ${selected.symbol}`);
        }

        function updateStats() {
            // Реальный баланс портфеля
            const portfolioBalance = TOKENS.reduce((sum, t) => sum + (t.balance * PRICES[t.symbol]), 0);
            
            const totalStaked = stakes.reduce((s, st) => s + st.amount * PRICES[st.symbol], 0);
            const earned = stakes.reduce((s, st) => s + st.rewards * PRICES[st.symbol], 0);
            const active = stakes.filter(s => !s.done).length;
            const done = stakes.filter(s => s.done).length;

            // Показываем реальный баланс портфеля + застейканные токены
            const totalValue = portfolioBalance + totalStaked;
            document.getElementById('totalStaked').textContent = '$' + fmt(totalValue);
            document.getElementById('totalEarned').textContent = '$' + fmt(earned);
            document.getElementById('activeCount').textContent = active;
            document.getElementById('completedCount').textContent = done + ' done';
            
            // Обновить фильтры
            loadFilters();
        }

        function renderStakes() {
            const list = document.getElementById('stakesList');
            if(!stakes.length) {
                list.innerHTML = '<div style="text-align:center;padding:40px;color:var(--text-muted)">No stakes yet</div>';
                return;
            }

            list.innerHTML = '';
            stakes.sort((a,b) => a.done - b.done).forEach((st, i) => {
                const t = TOKENS.find(x => x.symbol === st.symbol);
                const elapsed = Math.floor((Date.now() - st.start) / 86400000);
                const done = elapsed >= st.period || st.done;
                
                const networkBadge = st.network ? `<span style="font-size:10px;color:var(--text-muted);margin-left:4px;">• ${st.network}</span>` : '';

                const div = document.createElement('div');
                div.className = 'stake-item';
                div.innerHTML = `
                    <div class="stake-header">
                        <div class="stake-info">
                            <img src="${t.logo}" class="stake-icon" onerror="this.style.display='none'">
                            <div>
                                <div class="stake-symbol">${st.symbol}${networkBadge}</div>
                                <div class="stake-period">${PERIODS[st.period]} • ${done ? 'Done' : elapsed+'/'+st.period+' days'}</div>
                            </div>
                        </div>
                        <div class="stake-badge ${done ? 'completed' : 'active'}">${done ? '✓ Done' : '⏳ Active'}</div>
                    </div>
                    <div class="stake-grid">
                        <div class="stake-cell">
                            <div class="stake-cell-label">Staked</div>
                            <div class="stake-cell-value">${fmt(st.amount)}</div>
                            <div class="stake-cell-usd">≈ $${fmt(st.amount * PRICES[st.symbol])}</div>
                        </div>
                        <div class="stake-cell">
                            <div class="stake-cell-label">Earned</div>
                            <div class="stake-cell-value" style="color:var(--success)">+${fmt(st.rewards)}</div>
                            <div class="stake-cell-usd">≈ $${fmt(st.rewards * PRICES[st.symbol])}</div>
                        </div>
                    </div>
                    ${done ? 
                        `<button class="btn btn-success" onclick="withdraw(${i})">💰 Withdraw ${fmt(st.amount + st.rewards)} ${st.symbol}</button>` :
                        `<button class="btn btn-secondary" onclick="cancel(${i})">Cancel</button>`
                    }
                `;
                list.appendChild(div);
            });
        }

        function withdraw(i) {
            const st = stakes[i];
            const total = st.amount + st.rewards;
            
            // Show loading modal
            document.getElementById('loadingModal').classList.add('active');
            let countdown = 8;
            const interval = setInterval(() => {
                countdown--;
                document.getElementById('countdown').textContent = countdown + ' seconds remaining...';
                if(countdown <= 0) {
                    clearInterval(interval);
                    document.getElementById('loadingModal').classList.remove('active');
                    
                    // Return to balance
                    const t = TOKENS.find(x => x.symbol === st.symbol);
                    t.balance += total;
                    stakes.splice(i, 1);
                    
                    // Show success
                    document.getElementById('successText').textContent = fmt(total) + ' ' + st.symbol + ' sent to your wallet';
                    document.getElementById('successModal').classList.add('active');
                    
                    setTimeout(() => {
                        document.getElementById('successModal').classList.remove('active');
                        loadTokens();
                        updateStats();
                        renderStakes();
                    }, 2000);
                }
            }, 1000);
        }

        function cancel(i) {
            const st = stakes[i];
            if(!confirm(`Cancel ${fmt(st.amount)} ${st.symbol}?`)) return;
            
            const t = TOKENS.find(x => x.symbol === st.symbol);
            t.balance += st.amount;
            stakes.splice(i, 1);
            loadTokens();
            updateStats();
            renderStakes();
        }

        document.getElementById('amount').addEventListener('input', updateEst);

        loadFilters();
        loadTokens();
        loadNetworks();
        loadPeriods();
        updateStats();
        renderStakes();
        updateEst();
    </script>
</body>
</html>
